appId: com.tingfeng.vap
productName: TingFeng Hermes
copyright: Copyright © Tingfeng (lza6)
directories:
  output: dist
# 入口
files:
  - main.js
  - preload.js
  - runtime-controller.js
  - log-store.js
  - crash-diagnostics.js
  - cua-service.js
  - package.json
# 打包 node_modules(含 electron-updater,生产必需)
  - node_modules/**/*
# 不打包开发依赖(避免把 electron-builder 自身塞进安装包)
extraFiles:
  - filter:
      - "**/*"
    from: ../webapp/out
    to: resources/webapp/out
# 把 venv 与 Python 源码打入安装包(开发期可选,发布期关键)
extraResources:
  - from: ../venv
    to: venv
    filter: ["**/*"]
  - from: ../src
    to: src
    filter: ["**/*.py", "**/*.txt", "**/*.md"]
  - from: ../config
    to: config
    # v10.3.1 (P0-7):补 **/*.md —— config/skills/*/SKILL.md 此前被
    # filter 排除,安装包内 0 个 skill(仓库 12 个)。
    filter: ["**/*.txt", "**/*.ini", "**/*.json", "**/*.md"]
  - from: ../requirements.txt
    to: requirements.txt
win:
  target: nsis
  icon: assets/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TingFeng Hermes
mac:
  target: dmg
  icon: assets/icon.png
linux:
  target: AppImage
  icon: assets/icon.png
